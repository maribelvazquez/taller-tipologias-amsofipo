<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Consulta por tipologías · AMSOFIPO — Comisión de PLD</title>
<style>
:root{
  --bg:#FAF8FC; --bg2:#F3EFF8; --panel:#FFFFFF; --panel2:#F6F2FA;
  --line:#E2D8EC; --line2:#CDBBDE;
  --tx:#1C1026; --tx2:#4E3E60; --tx3:#7A6A8A;
  --acc:#8B2A93; --acc2:#6F2693; --ok:#0E7C5A; --warn:#A66A00;
  --hdr1:#301457; --hdr2:#210E3A; --r:14px;
  --f:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font-family:var(--f);font-size:17px;line-height:1.6}
h1,h2,h3,h4{margin:0;font-weight:650;letter-spacing:-.01em}
a{color:var(--acc2)}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:16px;padding:12px 22px;
  background:linear-gradient(90deg,var(--hdr1),var(--hdr2) 55%,#150725);color:#fff}
header img{height:38px}
header .div{width:1px;height:32px;background:rgba(255,255,255,.3)}
header b{display:block;font-size:17px;line-height:1.2}
header span{font-size:12.5px;color:rgba(255,255,255,.72);letter-spacing:.06em;text-transform:uppercase}
header .acc{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.btn{padding:8px 14px;border-radius:9px;background:#fff;border:1px solid var(--line2);color:var(--acc2);font:inherit;font-size:14px;font-weight:600;cursor:pointer;text-decoration:none}
.btn.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.4)}
#wrap{display:grid;grid-template-columns:280px 1fr;min-height:calc(100vh - 62px)}
nav{background:var(--panel2);border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:62px;height:calc(100vh - 62px);overflow:auto}
nav .lab{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--tx3);font-weight:600;margin:12px 10px 6px}
nav button{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:none;background:none;font:inherit;
  padding:9px 10px;border-radius:10px;cursor:pointer;color:var(--tx)}
nav button .n{flex:none;width:26px;height:26px;border-radius:7px;background:#EDE3F5;color:var(--acc2);font-size:12.5px;font-weight:700;display:grid;place-items:center}
nav button b{display:block;font-size:15px;line-height:1.3;font-weight:600}
nav button small{display:block;font-size:12.5px;color:var(--tx3)}
nav button.on{background:linear-gradient(135deg,#8B2A93,#6F2693);color:#fff}
nav button.on .n{background:rgba(255,255,255,.22);color:#fff}
nav button.on small{color:rgba(255,255,255,.8)}
main{padding:34px 44px 70px;max-width:1180px}
.kicker{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--acc2);font-weight:700;margin-bottom:6px}
h1{font-size:40px;line-height:1.15;margin-bottom:8px}
.sub{font-size:21px;color:var(--tx2);margin:0 0 18px;max-width:900px}
.meta{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 18px}
.tag{display:inline-block;padding:4px 12px;border-radius:20px;font-size:13.5px;background:#F0E8F6;color:var(--tx2);border:1px solid var(--line2)}
.tag b{color:var(--acc2)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:22px 26px;margin:16px 0;box-shadow:0 1px 3px rgba(45,20,70,.05)}
.card h3{font-size:19px;margin-bottom:8px;color:var(--acc2)}
.card.com{border-left:5px solid var(--acc);background:linear-gradient(90deg,#FBF4FD,#fff 40%)}
.card.uif{border-color:var(--acc2);background:var(--panel2)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
ul{margin:6px 0;padding-left:20px} li{margin:3px 0}
p{margin:6px 0}
.lbl{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--tx3);font-weight:700;margin:10px 0 2px}
.narr{background:var(--bg2);border-radius:10px;padding:12px 16px;font-size:15.5px;color:var(--tx2);font-style:italic}
.aporte{border-bottom:1px solid var(--line);padding:10px 0}
.aporte:last-child{border-bottom:none}
.aporte .who{font-size:13px;color:var(--tx3);font-weight:600}
.aporte .tipo{display:inline-block;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:#fff;background:var(--acc2);border-radius:5px;padding:1px 7px;margin-right:6px}
.aporte .tipo.duda{background:var(--warn)} .aporte .tipo.caso{background:var(--ok)} .aporte .tipo.param{background:#4E3E60}
.vacio{color:var(--tx3);font-style:italic}
.kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:14px 0}
.kpi div{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.kpi b{display:block;font-size:34px;line-height:1.15}
.kpi small{color:var(--tx3);font-size:14px}
.bar{display:grid;grid-template-columns:230px 1fr 30px;gap:10px;align-items:center;font-size:15px;margin:5px 0}
.bar i{display:block;height:14px;border-radius:7px;background:linear-gradient(90deg,#8B2A93,#6F2693)}
.bar span:last-child{font-weight:700;text-align:right}
table{width:100%;border-collapse:collapse;font-size:15px}
th{text-align:left;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:#fff;background:var(--acc2);padding:8px 10px}
td{vertical-align:top;border-bottom:1px solid var(--line);padding:9px 10px;color:var(--tx2)}
.tip{display:none}
.tip.on{display:block}
.indice{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.indice a{display:block;text-decoration:none;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.indice a:hover{border-color:var(--acc2)}
.indice a b{display:block;font-size:16px}
.indice a small{color:var(--tx3);font-size:13.5px}
.pie{font-size:12.5px;color:var(--tx3);border-top:1px solid var(--line);margin-top:40px;padding-top:12px}
.printhead{display:none}
@media screen and (max-width:900px){#wrap{grid-template-columns:1fr} nav{position:static;height:auto} main{padding:22px 16px} .g2,.g3,.indice,.kpi{grid-template-columns:1fr} h1{font-size:30px}}
@media print{
  @page{size:Letter;margin:14mm 13mm}
  body{background:#fff;font-size:11.5pt}
  header,nav{display:none}
  #wrap{display:block}
  main{padding:0;max-width:none}
  .tip{display:block!important;break-before:page}
  .tip#t-portada{break-before:auto}
  .card{box-shadow:none;break-inside:avoid;padding:10px 14px;margin:7px 0}
  .g2{gap:10px} .kpi{grid-template-columns:repeat(4,1fr)} .indice{grid-template-columns:repeat(3,1fr)}
  .card h3{font-size:12.5pt} ul{margin:3px 0} li{margin:1px 0} p{margin:3px 0} .lbl{margin:5px 0 1px}
  .narr{font-size:10pt;padding:8px 12px}
  .card.big{break-inside:auto}
  h1{font-size:26pt}
  .sub{font-size:13pt}
  .printhead{display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid var(--acc2);padding-bottom:8px;margin-bottom:14px}
  .printhead img{height:30px}
  .printhead span{font-size:9pt;color:var(--tx3);letter-spacing:.08em;text-transform:uppercase}
  .noprint{display:none!important}
  th{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .card.com,.card.uif,.narr,.bar i,.aporte .tipo,.kpi div,.tag{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<header>
  <img src="assets/logo-amsofipo.png" alt="AMSOFIPO">
  <div class="div"></div>
  <div><b>Consulta por tipologías</b><span>AMSOFIPO · Comisión de PLD</span></div>
  <div class="acc">
    <a class="btn ghost" href="/">← Volver al taller</a>
    <button class="btn" onclick="window.print()">Descargar PDF</button>
  </div>
</header>
<div id="wrap">
  <nav id="nav"></nav>
  <main id="main"></main>
</div>

<script>
/* =====================================================================
   CONSULTA POR TIPOLOGÍAS
   Base: Compendio de Tipologías para SOFIPOs (11ª Convención, GMC360 · LEX-QUO).
   Complemento: aportes capturados en la plataforma y lo dicho en las
   sesiones 1 a 3 del Taller de Tipologías de la Comisión de PLD.
   Los casos del comité se describen sin nombre de institución.
   ===================================================================== */
const CORTE='12 de noviembre de 2026';

const T=[
{id:'mula',n:'01',nombre:'Cuentas mula',lema:'Redes de cuentas de paso que reciben y dispersan recursos ajenos',
 canal:'Digital',detecta:'Sistema',delito:'Fraude, extorsión, venta ilícita',ficha:4,
 sesiones:'Sesión 1 · simulador de red',
 opera:'Personas reclutadas, pagadas o engañadas prestan o venden su cuenta para recibir recursos de terceros y moverlos de inmediato. La cuenta recibe abonos de ordenantes sin relación entre sí y en pocas horas los transfiere o retira hasta dejar el saldo cerca de cero. Las redes abren cuentas en ráfaga, con perfiles parecidos, y las abandonan cuando una institución las bloquea.',
 vulnerable:'La apertura remota ágil, las cuentas de nivel básico con límites que se usan en serie y las transferencias 24 horas hacen de la SOFIPO digital un punto de paso atractivo. En la SOFIPO con sucursales, el riesgo aparece cuando la red recluta clientes locales y los acompaña a abrir la cuenta.',
 scli:['La cuenta se abre desde el mismo dispositivo, red o número que otras cuentas.','La ocupación y el ingreso declarados no explican el volumen que recibe.','El titular no sabe explicar quién le deposita ni para qué.','Cambia teléfono o correo poco después de abrir la cuenta.','Sesiones simultáneas o accesos desde ubicaciones lejanas a su domicilio.'],
 sop:['Muchos ordenantes distintos, sin relación con el titular ni entre sí.','Lo que entra sale en menos de 24 a 48 horas y el saldo queda mínimo.','Montos redondos o apenas por debajo de los límites de la cuenta.','Retiros en cajero justo después de cada abono.','Volumen alto en las primeras semanas de una cuenta nueva.'],
 param:['10 o más ordenantes distintos en 7 días, en cuentas con menos de 90 días de antigüedad.','90 % o más de lo recibido transferido o retirado en 48 horas.','Un mismo identificador de dispositivo asociado a 3 o más cuentas.'],
 revisar:['Vínculos por dispositivo, teléfono, correo y cuenta destino con otros clientes.','Reclamaciones de fraude o solicitudes de otras instituciones sobre los abonos.','A dónde va el dinero: si varias cuentas convergen en un destino, hay red.','Si el titular es víctima o participante; cambia la acción a tomar.'],
 narr:'Cuenta de nivel básico abierta por canal digital el 3 de marzo, cliente de 21 años, estudiante, ingreso declarado de $6,000. Entre el 10 y el 24 de marzo recibió 38 transferencias de 31 ordenantes distintos por $412,300 y transfirió el 97 % a tres cuentas de otra institución en menos de 24 horas por abono. El dispositivo de alta es el mismo que el de otras cuatro cuentas abiertas en la misma semana. Dos ordenantes reclamaron fraude.',
 ref:'GAFI, Illicit Financial Flows from Cyber-Enabled Fraud (2023).',
 comite:[
  ['param','Elementos que conviene cruzar: las cuentas que fondean y las contrapartes detrás de ellas, fechas de las transacciones, geolocalización, IP y noticias negativas.','SOFIPO digital · sesión 3'],
  ['senal','En cuentas de nivel limitado, el patrón de mula es mensual y repetido: entra el máximo permitido y sale casi de inmediato, mes tras mes.','SOFIPO digital · sesión 3'],
  ['reco','Respuesta escalonada: cuando el perfil se sale del producto, pedir que complete el expediente del siguiente nivel; si no lo hace y el riesgo crece, bloqueo operativo, reporte de operación inusual y paso a riesgo alto con debida diligencia reforzada.','SOFIPO digital · sesión 3'],
  ['reco','Alertar sobre grupos de cuentas, no sobre cuentas aisladas; ventana corta de 24 a 72 horas para captar el efecto de cuenta puente; narrar el anillo completo en un solo reporte.','Criterio de trabajo del taller · sesión 1']],
 dudas:['Cuándo el titular es víctima (le vendieron o engañaron) y cuándo participante, y cómo cambia el reporte.'],
 uif:'',radar:[4,1]},

{id:'fachada',n:'02',nombre:'Empresas fachada',lema:'Personas morales con expediente impecable y sin operación real',
 canal:'Ambos',detecta:'Analista',delito:'Defraudación fiscal, corrupción, lavado de terceros',ficha:6,
 sesiones:'Sesión 1 · expediente vivo',
 opera:'La empresa existe en papel: acta, RFC, domicilio y apoderado en orden. Pero no produce ni vende: sirve para simular ingresos, emitir comprobantes, recibir recursos y repartirlos entre personas físicas u otras empresas. Suele operar en grupos que comparten domicilio, apoderados o contadores.',
 vulnerable:'La SOFIPO que atiende a pequeñas empresas otorga crédito comercial, abre cuentas de dispersión y confía en un expediente documental. Si la revisión termina en la integración del expediente, la fachada pasa: los documentos son auténticos, lo falso es la actividad. En SOFIPOS de nivel II a IV, con crédito comercial, arrendamiento y factoraje, se vuelve un problema de integración.',
 scli:['Domicilio virtual o compartido con muchas otras empresas.','Objeto social amplísimo, sin actividad preponderante clara.','Constitución reciente, capital mínimo y operación alta desde el primer mes.','El apoderado también lo es de otros clientes sin relación aparente.','El representante no conoce el negocio: no sabe quiénes son sus clientes ni proveedores.'],
 sop:['Recibe de muchas empresas y paga el mismo día a personas físicas.','No hay pagos de una operación real: nómina, seguridad social, renta, insumos.','Flujos circulares entre empresas del mismo grupo.','Montos incompatibles con su capital social y su antigüedad.','Retiros en efectivo en una empresa que dice prestar servicios digitales.'],
 param:['Flujo mensual superior a 20 veces el capital social durante los primeros 6 meses.','80 % o más de las salidas a personas físicas sin relación laboral acreditada.','3 o más clientes con el mismo domicilio fiscal o el mismo apoderado.'],
 revisar:['Si la empresa o sus contrapartes aparecen en la lista del artículo 69-B del CFF.','Quién es el propietario real y si coincide con quien toma las decisiones.','Coincidencias de domicilio, apoderados, teléfonos y correos con otros clientes.','Evidencia de operación: visita, página, empleados, facturas de insumos.'],
 narr:'Persona moral constituida en enero con capital de $50,000, objeto social de consultoría. De febrero a mayo recibió $8.7 millones de 14 personas morales y el mismo día de cada abono transfirió el 92 % a 23 personas físicas sin relación laboral acreditada. No registra pagos de nómina, renta ni proveedores. Comparte domicilio y apoderado con otros dos clientes con el mismo patrón.',
 ref:'GAFI y Grupo Egmont, Concealment of Beneficial Ownership (2018).',
 comite:[
  ['reco','Cruce con fuentes públicas: constancia fiscal contra actividad declarada, representante en otras altas, antigüedad contra monto pretendido, domicilio (existe, es residencial, se repite), presencia digital de la actividad y artículo 69-B del CFF.','Criterio de trabajo del taller · sesión 1'],
  ['senal','En el Radar del comité, sólo una de 14 instituciones la marcó como vista en el último año. Su detección depende del analista, no del sistema.','Radar del comité · sesión 3']],
 dudas:['Qué se documenta cuando el alta de una persona moral no se concreta (ver Tentativas).'],
 uif:'',radar:[1,2]},

{id:'tentativas',n:'03',nombre:'Tentativas',lema:'El cliente se retira cuando se le pide el origen de los recursos',
 canal:'Ambos',detecta:'Analista',delito:'Cualquiera',ficha:8,
 sesiones:'Sesiones 2 y 3 · caso de una SOFIPO digital',
 opera:'Un cliente o prospecto intenta abrir una cuenta, depositar, invertir o liquidar un crédito y desiste cuando se le pide documentación, se le explica que la operación se reporta o se le aplica un control. A veces regresa con un monto menor, por otro canal o con otra persona como titular.',
 vulnerable:'Lo que no se concreta casi nunca queda registrado. Si el sistema sólo ve operaciones realizadas, la tentativa no existe para el monitoreo, y la única fuente es el personal de sucursal o el registro del flujo de alta digital.',
 scli:['Abandona el trámite en el momento en que se pide soporte del origen de los recursos.','Pregunta a partir de qué monto se reporta o se pide identificación.','Propone que otra persona sea el titular.','Intenta la misma operación en varias sucursales o canales el mismo día.','Insiste en pagar en efectivo cuando se le ofrecen otros medios.'],
 sop:['Intentos rechazados seguidos de un reintento con monto menor.','La misma operación dividida entre varias cuentas del mismo grupo.','Alta digital abandonada en el paso de origen de recursos, con monto declarado alto.','Liquidación anticipada de crédito cancelada al pedirle el origen del pago.','Reintentos desde otro dispositivo o con otros datos después de un rechazo.'],
 param:['3 o más intentos rechazados del mismo cliente o dispositivo en 24 horas.','Abandono del alta en el paso de origen de recursos con monto declarado alto para el segmento.','Reintento de la operación con monto menor dentro de las 72 horas siguientes.'],
 revisar:['Si existe una bitácora de operaciones intentadas; sin ella, no hay forma de reportarlas.','Qué datos dejó el cliente: con frecuencia bastan para vincularlo con otras cuentas.','Si el personal de sucursal sabe que una tentativa se escala al oficial.','Si se reintentó por otro canal o con otra persona.'],
 narr:'Prospecto que el 12 de agosto pretendió abrir una inversión a plazo por $950,000 en efectivo en la sucursal Centro. Al pedírsele el soporte del origen de los recursos, dijo que eran ahorros familiares y se retiró sin firmar. El 14 de agosto una persona con el mismo domicilio intentó la misma apertura por $480,000 en otra sucursal y también desistió. Se registran ambos intentos y se reportan como operación inusual.',
 ref:'GAFI, Recomendación 20: el reporte comprende las operaciones intentadas, sin importar el monto.',
 comite:[
  ['caso','SOFIPO 100 % digital. Un prospecto quiso abrir una cuenta para recibir un monto muy por encima de su perfil por la supuesta venta de un terreno. Actividad sin sustento, expediente incompleto, origen no acreditado y la historia cambió: el dinero llegaría primero a la cuenta de un familiar. Sin coincidencia en listas; fuentes abiertas con coincidencias de apellidos y zona de riesgo, no concluyentes solas. Decidió la convergencia: se rechazó la relación, resolvió el Comité de Comunicación y Control y se presentó reporte de operación inusual.','SOFIPO digital · sesión 2'],
  ['reco','Hay dos tentativas distintas: en el alta (si el expediente no está completo, el cliente no se da de alta) y en la operación (el cliente con cuenta limitada intenta operar por encima, se le pide información y desiste). La segunda es la que suele llegar a reporte.','SOFIPO digital · sesión 3'],
  ['senal','Abandonar el alta por fricción del servicio no es inusual. La inusualidad aparece cuando el abandono coincide con un cuestionamiento específico: origen, propósito, monto.','SOFIPO digital · sesión 3'],
  ['reco','Se reporta como operación inusual sin prioridad, con dictamen del Comité de Comunicación y Control; no como reporte de 24 horas si no hay coincidencia con la Lista de Personas Bloqueadas.','SOFIPO digital · sesión 3'],
  ['senal','Con cuentas simplificadas de 3,000 UDIS, varias SOFIPOS digitales ven una tasa alta de abandono justo cuando se pide complementar el expediente para operar más.','Dirección AMSOFIPO · sesión 3'],
  ['reco','Listas internas: al menos tres instituciones alimentan una lista propia con los hallazgos de tentativas, investigaciones de fraude y requerimientos de la autoridad (excluyendo a las víctimas), incluida el área de crédito.','Sesiones 2 y 3'],
  ['duda','En crédito con sucursales, al prospecto que no cumple requisitos se le descarta antes de abrir folio y no se reporta. ¿Eso es una tentativa?','SOFIPO con sucursales · sesión 3']],
 dudas:['Qué se conserva de una tentativa: entrevista, documentos pedidos y no entregados, búsquedas y su resultado.','Cuándo se reporta una relación que nunca existió y cómo se narra sin operación de por medio.','El deber ser con cuentas simplificadas: el cliente quiere subir de nivel, se le pide información y deja de responder.','Si las listas internas se recomiendan como práctica del sector.'],
 uif:'Un campo o código que permita reportar la tentativa como tal, y criterio sobre cómo narrar una relación que no se concretó.',radar:[4,3]},

{id:'credito',n:'04',nombre:'Pago anticipado atípico de crédito',lema:'El crédito como vehículo para dar apariencia lícita a los recursos',
 canal:'Ambos',detecta:'Sistema',delito:'Narcotráfico, corrupción, delitos fiscales',ficha:10,
 sesiones:'Sesión 2 · línea de vida del crédito',
 opera:'El cliente obtiene un crédito y lo liquida en semanas con recursos cuyo origen no justifica. El dinero ilícito entra como pago y el crédito queda como explicación lícita de los bienes o del dinero que el cliente recibió. En su variante cíclica, liquida y pide un crédito nuevo de inmediato.',
 vulnerable:'La cartera y la captación suelen monitorearse por separado, y un pago anticipado se ve como buena noticia para el área de crédito. Sin un cruce contra el perfil del cliente, la alerta no se genera. Con arrendamiento y factoraje el patrón es el mismo.',
 scli:['Cliente con ingreso declarado bajo que liquida en semanas un crédito a plazo largo.','Pregunta por penalizaciones de pago anticipado antes de disponer del crédito.','Pide un crédito nuevo en cuanto liquida el anterior.','El pago lo hace un tercero sin relación clara con el acreditado.','Insiste en liquidar en efectivo.'],
 sop:['Pagos en efectivo fraccionados en varios días o sucursales.','Pago desde la cuenta de un tercero o de una empresa ajena al acreditado.','Liquidación total antes de cumplir la cuarta parte del plazo.','Varios créditos del mismo grupo liquidados en las mismas fechas.','Depósitos en garantía que se retiran en cuanto se libera el crédito.'],
 param:['Liquidación de 50 % o más del saldo antes del 25 % del plazo pactado.','Pago anticipado superior a 3 veces el ingreso mensual declarado.','Pago realizado por un tercero no registrado como obligado solidario ni familiar.'],
 revisar:['De dónde viene el dinero del pago, no sólo que el pago se aplicó.','Quién es el tercero que paga y qué relación tiene con el acreditado.','El historial: si el cliente ya repitió el ciclo de crédito y liquidación anticipada.','Si el destino del crédito original coincide con lo declarado.'],
 narr:'Crédito personal por $300,000 a 36 meses otorgado el 5 de abril a un cliente con ingreso declarado de $18,000 mensuales como empleado. El 28 de mayo se liquidó en su totalidad con tres depósitos en efectivo de $98,000 en dos sucursales. El 2 de junio el cliente solicitó un crédito nuevo por $500,000. No presentó soporte del origen del pago.',
 ref:'GAFILAT, informes de tipologías regionales de lavado de activos.',
 comite:[
  ['param','Alerta si el crédito se liquida dentro de los 30 días siguientes al otorgamiento. Simple de configurar; en créditos largos deja pasar liquidaciones tempranas (mes 2 de 36).','Una SOFIPO · sesión 2'],

const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const li=a=>a&&a.length?'<ul>'+a.map(x=>`<li>${esc(x)}</li>`).join('')+'</ul>':'<p class="vacio">—</p>';
const TIPO={param:['param','Parámetro'],senal:['','Señal'],reco:['','Práctica'],caso:['caso','Caso'],duda:['duda','Duda']};
const head=()=>`<div class="printhead"><img src="assets/logo-amsofipo-color.png" alt="AMSOFIPO"><span>Comisión de PLD · Consulta por tipologías · ${CORTE}</span></div>`;

function barras(lista){
  const max=Math.max(...lista.map(r=>Math.max(r[1]||0,r[2]||0)),1);
  return lista.map(([t,c,v])=>`<div class="bar"><span>${esc(t)}</span><span><i style="width:${(c||0)/max*100}%"></i></span><span>${c==null?'—':c}</span></div>`).join('');
}

  <div class="kpi">

function ficha(t){
  const ap=t.comite.length?t.comite.map(([k,txt,who])=>`<div class="aporte"><span class="tipo ${TIPO[k][0]}">${TIPO[k][1]}</span>${esc(txt)}<div class="who">${esc(who)}</div></div>`).join('')
    :'<p class="vacio">Sin aportes del comité todavía.</p>';
  const rad=t.radar?`<span class="tag">Radar · comité <b>${t.radar[0]==null?'—':t.radar[0]+' de 14'}</b> · Convención <b>${t.radar[1]==null?'—':t.radar[1]+' de 8'}</b></span>`:'';
  return `<section class="tip" id="t-${t.id}">${head()}

  <div class="g2">

  <div class="g2">
    <div class="card"><h3>Parámetros de referencia</h3>${li(t.param)}<p style="font-size:13px;color:var(--tx3)">Ilustrativos: cada institución los calibra con su matriz de riesgo.</p></div>
    <div class="card"><h3>Qué revisar antes de decidir</h3>${li(t.revisar)}</div>
  </div>
  ${t.narr?`<div class="card"><h3>Cómo narrarlo en el reporte</h3><div class="narr">${esc(t.narr)}</div><p style="font-size:13px;color:var(--tx3);margin-top:8px">Ejemplo ficticio. Referencia: ${esc(t.ref)}${t.ficha?` · <a href="assets/Compendio_Tipologias_SOFIPOs.pdf#page=${t.ficha}" target="_blank" rel="noopener">ficha del compendio</a>`:''}</p></div>`:(t.ref?`<p style="font-size:13px;color:var(--tx3)">${esc(t.ref)}</p>`:'')}
  <div class="card com big"><h3>Lo que aportó el comité</h3>${ap}</div>
  <div class="g2">
    <div class="card"><h3>Lo que el manual tiene que resolver</h3>${li(t.dudas)}</div>
    <div class="card uif"><h3>Para llevar a la UIF</h3>${t.uif?`<p>${esc(t.uif)}</p>`:'<p class="vacio">Sin propuesta específica todavía.</p>'}</div>
  </div>
  </section>`;
}

function listas(){
  return `<section class="tip" id="t-listas">${head()}
  <div class="kicker">Apartado transversal · sesión 2</div>
  <h1>Listas y jurisdicciones</h1>
  <p class="sub">No es una tipología: es un alertamiento. Es donde más consultas llegan a la Comisión, porque no todas las listas obligan lo mismo ni se documentan igual.</p>
  <div class="g2">${LISTAS.puntos.map(([t,d])=>`<div class="card"><h3>${esc(t)}</h3><p>${esc(d)}</p></div>`).join('')}</div>
  <div class="card"><h3>Lo que el manual tiene que resolver</h3>${li(LISTAS.dudas)}</div>
  </section>`;
}

function radar(){
  const tabla=(tit,l)=>`<div class="card"><h3>${tit}</h3><table><thead><tr><th>Respuesta</th><th>Comité (14)</th><th>Convención (8)</th></tr></thead><tbody>${l.map(([t,c,v])=>`<tr><td>${esc(t)}</td><td>${c==null?'—':c}</td><td>${v==null?'—':v}</td></tr>`).join('')}</tbody></table></div>`;
  return `<section class="tip" id="t-radar">${head()}
  <div class="kicker">Radar de Tipologías · Convención (30 sep – 1 oct) y comité (sesión 3)</div>
  <h1>Lo que dice el Radar</h1>
  <p class="sub">Muestras pequeñas: son un indicio para orientar el manual, no una estadística del sector. Se excluyen las respuestas de prueba del equipo facilitador. El guion (—) indica que la opción no estaba en ese levantamiento o no tuvo respuestas.</p>
  <div class="card"><h3>Comportamientos vistos en el último año · comité</h3>${barras(RADAR.vistos)}</div>
  <div class="g2">${tabla('El paso más complicado',RADAR.paso)}${tabla('La alerta que más trabajo da y menos resultado',RADAR.alerta)}</div>
  <div class="card com"><h3>Lectura</h3><ul>
   <li>El problema no es detectar: es <b>decidir si se reporta</b> y <b>juntar la evidencia</b>. Es lo que el manual tiene que resolver.</li>
   <li>Las alertas por monto o frecuencia generan volumen, pero no casos.</li>
   <li>El crédito con prepago atípico encabeza en ambos levantamientos y es el principal hueco del catálogo que señala el sector.</li>
   <li>La suplantación aparece en el comité con el mismo peso que tentativas y cuentas mula.</li></ul></div>
  </section>`;
}

function reporte(){
  return `<section class="tip" id="t-reporte">${head()}
  <div class="kicker">Cierre del compendio</div>
  <h1>Un reporte que la UIF sí pueda usar</h1>
  <p class="sub">La descripción de la operación es lo único que el analista de la autoridad lee sin el expediente a la mano. Tiene que sostenerse sola.</p>
  <div class="card"><h3>Cinco bloques, en este orden</h3><table><thead><tr><th>Quién</th><th>Qué</th><th>Cómo se detectó</th><th>Por qué es inusual</th><th>Qué se hizo</th></tr></thead>
  <tbody><tr><td>Cliente, perfil declarado, antigüedad, producto y canal.</td><td>Operaciones, montos, número, periodo y contrapartes.</td><td>Alerta del sistema, analista, sucursal o requerimiento.</td><td>La diferencia concreta frente al perfil y a la conducta esperada.</td><td>Consultas, contacto con el cliente, medidas y estado de la relación.</td></tr></tbody></table></div>
  <div class="card"><h3>Lo que debilita un reporte y cómo corregirlo</h3><table><thead><tr><th>Frecuente</th><th>Mejor</th></tr></thead><tbody>
   <tr><td>«Monto elevado para el perfil del cliente.»</td><td>«$412,300 en 14 días frente a un ingreso declarado de $6,000 mensuales.»</td></tr>
   <tr><td>Copiar el nombre de la alerta del sistema.</td><td>Describir la conducta que la alerta encontró.</td></tr>
   <tr><td>Omitir a quién se transfirió o de quién se recibió.</td><td>Nombrar contrapartes, instituciones y cuentas relevantes.</td></tr>
   <tr><td>Un reporte por cuenta cuando hay una red.</td><td>Describir el grupo y los datos que lo vinculan.</td></tr>
   <tr><td>«El cliente no justificó.»</td><td>Qué se le pidió, cuándo, qué respondió y qué no presentó.</td></tr></tbody></table></div>
  <div class="card uif"><h3>Tiempos</h3><p>Las Disposiciones de carácter general aplicables a las sociedades financieras populares establecen sesenta días naturales para remitir el reporte de operación inusual, contados a partir de que se genera la alerta, y prevén además el reporte dentro de las 24 horas cuando hay información o indicios de que los recursos pueden provenir de actividades ilícitas o destinarse a ellas. Documente la fecha de la alerta: es la que cuenta. Consulte el texto vigente.</p></div>
  <p class="pie">Fuentes: Ley de Ahorro y Crédito Popular, art. 124, y sus Disposiciones de carácter general; CFF art. 69-B; GAFI, Recomendaciones 10, 20 y 24; GAFI, Illicit Financial Flows from Cyber-Enabled Fraud (2023); GAFI y Egmont, Concealment of Beneficial Ownership (2018); GAFI, Guidance on Digital Identity (2020); GAFILAT, informes de tipologías.</p>
  </section>`;
}

function pintar(){
  document.getElementById('main').innerHTML=portada()+T.map(ficha).join('')+listas()+radar()+reporte();
  const it=[['portada','·','Inicio','Índice y cómo leer'],...T.map(t=>[t.id,t.n,t.nombre,t.canal+' · '+t.detecta.toLowerCase()]),
    ['listas','★','Listas y jurisdicciones','Apartado transversal'],['radar','◎','Lo que dice el Radar','Comité y Convención'],['reporte','✎','Un reporte útil','Cinco bloques']];
  document.getElementById('nav').innerHTML='<div class="lab">Consulta</div>'+it.map(([id,n,t,s])=>
    `<button data-id="${id}" onclick="ver('${id}')"><span class="n">${esc(n)}</span><span><b>${esc(t)}</b><small>${esc(s)}</small></span></button>`).join('');
  const h=(location.hash||'').slice(1);
  ver(h&&document.getElementById('t-'+h)?h:'portada',true);
}
function ver(id,silencio){
  document.querySelectorAll('.tip').forEach(s=>s.classList.toggle('on',s.id==='t-'+id));
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.id===id));
  if(!silencio)history.replaceState(null,'','#'+id);
  window.scrollTo(0,0);
}
pintar();
</script>
</body>
</html>
